services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: tech-challenge-api
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2:0.5b}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-90000}
      CACHE_WARMUP_MODE: ${CACHE_WARMUP_MODE:-initial}
      CACHE_WARMUP_PAGE_SIZE: ${CACHE_WARMUP_PAGE_SIZE:-60}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: tech-challenge-web
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
